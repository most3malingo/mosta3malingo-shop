    <section class="page-section">
        <div class="container page-content">
            <h1>تواصل معنا</h1>
            <p>لأي استفسار عن منتج أو المسابقة، ابعتلنا رسالة وهنرد عليك في أقرب وقت.</p>

            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="contactName">الاسم</label>
                    <input type="text" id="contactName" required>
                </div>
                <div class="form-group">
                    <label for="contactEmail">وسيلة التواصل (رقم أو إيميل)</label>
                    <input type="text" id="contactEmail" required>
                </div>
                <div class="form-group">
                    <label for="contactMessage">رسالتك</label>
                    <textarea id="contactMessage" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">إرسال</button>
                <div id="formMessage" class="form-message"></div>
            </form>
        </div>
    </section>
