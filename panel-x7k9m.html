<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>

    <div class="admin-page">
        <div class="admin-content">
            <h2>Admin Panel</h2>

            <div id="adminLogin">
                <form id="adminLoginForm">
                    <div class="form-group"><label>Email</label><input type="email" id="adminEmail" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="adminPassword" required></div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>

            <div id="adminDashboard" style="display: none;">

                <div class="admin-card" style="border-color: #f1c40f;">
                    <h3 style="color: #f1c40f; border-bottom: 2px solid #f1c40f; padding-bottom: 10px;">🏆 إعدادات مسابقة الصورة الغامضة</h3>
                    <form id="competitionAdminForm">
                        <div style="display: flex; gap: 10px;">
                            <div style="flex: 1;"><label>موعد البدء:</label><input type="datetime-local" id="compStartTimeAdmin" required></div>
                            <div style="flex: 1;"><label>موعد الإنتهاء:</label><input type="datetime-local" id="compEndTimeAdmin" required></div>
                        </div>

                        <label>الأسماء الصحيحة (افصل بينها بفاصلة ،):</label>
                        <textarea id="compValidNamesAdmin" rows="2" placeholder="مثال: ايفون 13, iphone 13" required></textarea>

                        <div style="display: flex; gap: 10px;">
                            <div style="flex: 1;"><label>قوة البلور في البداية (بيكسل):</label><input type="number" id="compInitialBlurAdmin" value="50" required></div>
                            <div style="flex: 1;"><label>تقليل البلور كل كام دقيقة؟:</label><input type="number" id="compBlurIntervalAdmin" value="30" required></div>
                            <div style="flex: 1;"><label>مقدار التقليل (بيكسل):</label><input type="number" id="compBlurDropAdmin" value="5" required></div>
                        </div>

                        <label>اختار المنتج اللي هيكون جايزة المسابقة (اسمه هيظهر للزوار بوضوح كجايزة):</label>
                        <select id="compProductAdmin" required>
                            <option value="">-- اختار منتج من المتجر --</option>
                        </select>

                        <label>صورة اللغز اللي هتتبلور (الزوار هيخمنوا اللي فيها، ارفعها من جهازك):</label>
                        <input type="file" id="compImageFileAdmin" accept="image/*">

                        <div style="text-align: center; margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px; border: 1px dashed #ccc;">
                            <p style="font-size: 0.9rem; font-weight: bold; margin-bottom: 10px;">معاينة صورة اللغز كما ستظهر للزوار في البداية (مبلورة):</p>
                            <img id="adminImagePreview" src="" style="max-width: 100%; height: 200px; object-fit: contain; border-radius: 10px; display: none; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                        </div>

                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <button type="submit" class="btn btn-primary" style="flex: 1; background-color: #f1c40f; color:#000;">إطلاق المسابقة 🚀</button>
                            <button type="button" class="btn btn-danger" id="stopCompBtn" style="flex: 1; margin-top: 0;">إيقاف المسابقة</button>
                        </div>
                    </form>
                </div>

                <div class="admin-card">
                    <h3>Add Product</h3>
                    <form id="addProductForm">
                        <input type="text" id="productName" placeholder="اسم المنتج" required>
                        <textarea id="productDescription" placeholder="وصف المنتج" required></textarea>
                        <input type="number" id="productPrice" placeholder="السعر" required step="0.01">
                        <input type="text" id="productImage" placeholder="رابط الصورة">
                        <input type="file" id="productImageFile" accept="image/*" style="margin-top:5px;">
                        <button type="submit" class="btn btn-primary" style="margin-top:10px;">إضافة المنتج</button>
                    </form>
                </div>
                <div class="admin-card">
                    <h3>Manage Products</h3>
                    <div id="adminProductsList"></div>
                </div>
                <button class="btn btn-danger" id="adminLogout">Logout</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
